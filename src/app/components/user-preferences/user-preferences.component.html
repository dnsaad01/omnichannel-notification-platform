<div class="preferences-container">
  <!-- Header -->
  <header class="app-header">
    <div class="header-brand">
      <div class="logo-icon">⚙️</div>
      <div>
        <h1>User Preference Manager</h1>
        <p>Search users &amp; configure notification channel preferences</p>
      </div>
    </div>
  </header>

  <div class="preferences-grid">
    <!-- Search Panel -->
    <section class="card search-card">
      <div class="card-header">
        <h2><span class="icon">🔍</span> Lookup User</h2>
        <span class="badge endpoint-badge">GET /api/v1/preferences/{userId}</span>
      </div>

      <div class="search-bar">
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input
            type="text"
            id="userIdInput"
            name="userIdInput"
            [(ngModel)]="userIdInput"
            placeholder="Enter User ID (e.g. user_789 or usr_1001)"
            (keyup.enter)="loadPreferences()"
          />
        </div>
        <button
          class="search-btn"
          (click)="loadPreferences()"
          [disabled]="!userIdInput.trim() || isLoading">
          <span *ngIf="!isLoading">🔎 Load User Preferences</span>
          <span *ngIf="isLoading" class="spinner-container">
            <span class="spinner"></span> Loading...
          </span>
        </button>
      </div>
    </section>

    <!-- Feedback Alerts -->
    <div *ngIf="successMessage" class="alert alert-success">
      <div class="alert-icon">✅</div>
      <div class="alert-content">
        <p>{{ successMessage }}</p>
      </div>
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger">
      <div class="alert-icon">⚠️</div>
      <div class="alert-content">
        <p>{{ errorMessage }}</p>
      </div>
    </div>

    <!-- Preferences Form (shown after successful load) -->
    <section *ngIf="userLoaded" class="card form-card">
      <div class="card-header">
        <h2><span class="icon">📋</span> Preferences for <span class="user-id-tag">{{ userId }}</span></h2>
        <span class="badge endpoint-badge">PUT /api/v1/preferences/{userId}</span>
      </div>

      <div class="preferences-form">
        <!-- Channel Toggles -->
        <div class="section-label">Notification Channels</div>
        <div class="toggles-row">
          <label class="toggle-card" for="emailToggle">
            <div class="toggle-info">
              <span class="toggle-icon">📧</span>
              <span class="toggle-label">Email</span>
            </div>
            <div class="toggle-switch">
              <input type="checkbox" id="emailToggle" [(ngModel)]="emailEnabled" />
              <span class="slider"></span>
            </div>
          </label>

          <label class="toggle-card" for="smsToggle">
            <div class="toggle-info">
              <span class="toggle-icon">💬</span>
              <span class="toggle-label">SMS</span>
            </div>
            <div class="toggle-switch">
              <input type="checkbox" id="smsToggle" [(ngModel)]="smsEnabled" />
              <span class="slider"></span>
            </div>
          </label>

          <label class="toggle-card" for="pushToggle">
            <div class="toggle-info">
              <span class="toggle-icon">🔔</span>
              <span class="toggle-label">Push</span>
            </div>
            <div class="toggle-switch">
              <input type="checkbox" id="pushToggle" [(ngModel)]="pushEnabled" />
              <span class="slider"></span>
            </div>
          </label>
        </div>

        <!-- Contact Info -->
        <div class="section-label">Contact Information</div>
        <div class="form-row">
          <div class="form-group flex-1">
            <label for="emailAddress">Email Address</label>
            <div class="input-wrapper">
              <span class="input-icon">✉️</span>
              <input
                type="email"
                id="emailAddress"
                name="emailAddress"
                [(ngModel)]="emailAddress"
                placeholder="user@example.com"
              />
            </div>
          </div>

          <div class="form-group flex-1">
            <label for="phoneNumber">Phone Number</label>
            <div class="input-wrapper">
              <span class="input-icon">📱</span>
              <input
                type="tel"
                id="phoneNumber"
                name="phoneNumber"
                [(ngModel)]="phoneNumber"
                placeholder="+1 (555) 000-0000"
              />
            </div>
          </div>
        </div>

        <!-- Save Button -->
        <button
          class="save-btn"
          (click)="savePreferences()"
          [disabled]="isSaving">
          <span *ngIf="!isSaving">💾 Save Preferences</span>
          <span *ngIf="isSaving" class="spinner-container">
            <span class="spinner"></span> Saving...
          </span>
        </button>
      </div>
    </section>
  </div>
</div>
