<header class="h-16 bg-slate-900/50 backdrop-blur-sm border-b border-slate-800 px-8 flex items-center justify-between">
  <!-- Search Input -->
  <div class="relative w-80">
    <lucide-icon [img]="SearchIcon" [size]="16" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></lucide-icon>
    <input
      type="text"
      placeholder="Search events, channels, templates..."
      class="w-full bg-slate-950 border border-slate-800 rounded-lg pl-9 pr-4 py-1.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all"
    />
  </div>

  <!-- Right Actions -->
  <div class="flex items-center gap-4">
    <button class="relative p-2 rounded-lg bg-slate-800/60 text-slate-400 hover:text-slate-200 border border-slate-700/50 hover:bg-slate-800 transition">
      <lucide-icon [img]="BellIcon" [size]="16"></lucide-icon>
      <span class="absolute top-1 right-1 h-2 w-2 rounded-full bg-indigo-500"></span>
    </button>

    <div class="h-8 w-px bg-slate-800"></div>

    <div class="flex items-center gap-3">
      <div class="h-8 w-8 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-300">
        <lucide-icon [img]="UserIcon" [size]="15"></lucide-icon>
      </div>
      <div class="text-left">
        <p class="text-xs font-medium text-slate-200">Engineer Admin</p>
        <p class="text-[10px] text-slate-400">admin&#64;omnichannel.io</p>
      </div>
    </div>
  </div>
</header>
