# Spring Application Name
spring.application.name=ingestion-service
server.port=8080

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/omnichannel_db
spring.datasource.username=postgres
spring.datasource.password=postgrespassword
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Redis Cache Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# Apache Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3

spring.kafka.consumer.group-id=notification-ingestion-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.eventflow.ingestion.dto

# Priority Topics & DLQ Circuit (Tickets #13, #14, #15)
app.kafka.topics.email-high=notification.email.high
app.kafka.topics.email-low=notification.email.low
app.kafka.topics.sms-high=notification.sms.high
app.kafka.topics.sms-low=notification.sms.low
app.kafka.topics.push-high=notification.push.high
app.kafka.topics.push-low=notification.push.low
app.kafka.topics.retry=notification-retry
app.kafka.topics.dlq=notification-dlq
