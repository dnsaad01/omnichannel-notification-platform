<div class="space-y-4">
  <p class="text-xs text-gray-500">
    Évaluée immédiatement contre le contexte actuel — n'attend pas. Pour une branche qui dépend d'un événement futur (ex. email ouvert), placez un nœud Wait avant.
  </p>

  <div>
    <label class="text-xs font-semibold text-gray-400 uppercase">Variable</label>
    <input
      type="text"
      [(ngModel)]="variable"
      placeholder="ex. email.opened"
      class="mt-1 w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm text-gray-200 font-mono focus:outline-none focus:border-orange-600" />
  </div>

  <div>
    <label class="text-xs font-semibold text-gray-400 uppercase">Opérateur</label>
    <select
      [(ngModel)]="operator"
      class="mt-1 w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm text-gray-200 focus:outline-none focus:border-orange-600">
      <option *ngFor="let op of operators" [value]="op.value">{{ op.label }}</option>
    </select>
  </div>

  <div *ngIf="operator !== 'exists'">
    <label class="text-xs font-semibold text-gray-400 uppercase">Valeur</label>
    <input
      type="text"
      [(ngModel)]="value"
      placeholder="ex. true"
      class="mt-1 w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm text-gray-200 font-mono focus:outline-none focus:border-orange-600" />
  </div>

  <div class="bg-gray-950 border border-gray-800 rounded-lg p-3 text-xs text-gray-500">
    <span class="text-emerald-400 font-medium">Sortie "yes"</span> si la condition est vraie,
    <span class="text-rose-400 font-medium">"no"</span> sinon. Reliez chaque sortie de ce nœud à un nœud suivant.
  </div>
</div>
