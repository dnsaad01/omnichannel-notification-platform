<div class="space-y-4">
  <p class="text-xs text-gray-500">
    Suspend l'exécution. Le planificateur (toutes les 15s côté backend) la reprendra automatiquement une fois le délai écoulé.
  </p>

  <div class="flex space-x-3">
    <div class="flex-1">
      <label class="text-xs font-semibold text-gray-400 uppercase">Durée</label>
      <input
        type="number"
        min="1"
        [(ngModel)]="duration"
        class="mt-1 w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm text-gray-200 focus:outline-none focus:border-orange-600" />
    </div>
    <div class="flex-1">
      <label class="text-xs font-semibold text-gray-400 uppercase">Unité</label>
      <select
        [(ngModel)]="unit"
        class="mt-1 w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm text-gray-200 focus:outline-none focus:border-orange-600">
        <option *ngFor="let u of units" [value]="u">{{ u }}</option>
      </select>
    </div>
  </div>
</div>
