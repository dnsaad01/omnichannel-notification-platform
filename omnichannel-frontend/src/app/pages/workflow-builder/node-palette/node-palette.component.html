<div class="w-56 shrink-0 bg-gray-900 border border-gray-800 rounded-xl p-4 space-y-5 h-full overflow-y-auto">
  <div *ngFor="let group of groups">
    <p class="text-xs font-semibold text-gray-500 uppercase mb-2">{{ group.title }}</p>
    <div class="space-y-2">
      <div
        *ngFor="let item of group.items"
        draggable="true"
        (dragstart)="onDragStart($event, item.type)"
        class="flex items-center space-x-2 bg-gray-950 border border-gray-800 rounded-lg px-3 py-2.5 cursor-grab active:cursor-grabbing hover:border-orange-700 transition select-none">
        <span class="text-lg">{{ item.icon }}</span>
        <span class="text-sm text-gray-200">{{ item.label }}</span>
      </div>
    </div>
  </div>

  <div class="pt-3 border-t border-gray-800">
    <p class="text-xs text-gray-500">Glissez un nœud sur le canevas, puis reliez-le au précédent en tirant depuis son point de connexion.</p>
  </div>
</div>
