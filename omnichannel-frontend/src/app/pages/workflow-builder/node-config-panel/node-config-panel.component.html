<div class="w-80 shrink-0 bg-gray-900 border border-gray-800 rounded-xl p-4 h-full overflow-y-auto">
  <div *ngIf="node; else emptyState">
    <div class="flex items-center justify-between mb-4">
      <span class="text-xs font-semibold text-gray-500 uppercase">{{ node.type }}</span>
      <button
        *ngIf="canDelete"
        (click)="deleteNode.emit()"
        class="text-xs text-rose-400 hover:text-rose-300 font-medium inline-flex items-center gap-1">
        <lucide-angular name="trash-2" [size]="13"></lucide-angular>
        Supprimer
      </button>
    </div>

    <div class="mb-4">
      <label class="text-xs font-semibold text-gray-400 uppercase">Nom du nœud</label>
      <input
        type="text"
        [ngModel]="node.name"
        (ngModelChange)="onNameInput($event)"
        class="mt-1 w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm text-gray-200 focus:outline-none focus:border-orange-600" />
    </div>

    <div class="border-t border-gray-800 pt-4">
      @switch (node.type) {
        @case ('TRIGGER') {
          <app-trigger-config [config]="node.config" (configChange)="onConfigChange($event)" />
        }
        @case ('NOTIFICATION') {
          <app-notification-config [config]="node.config" [templates]="templates" (configChange)="onConfigChange($event)" />
        }
        @case ('WAIT') {
          <app-wait-config [config]="node.config" (configChange)="onConfigChange($event)" />
        }
        @case ('GATEWAY') {
          <app-gateway-config [config]="node.config" (configChange)="onConfigChange($event)" />
        }
        @case ('END') {
          <app-end-config [config]="node.config" />
        }
      }
    </div>
  </div>

  <ng-template #emptyState>
    <div class="h-full flex items-center justify-center text-center px-4">
      <p class="text-sm text-gray-500">Sélectionnez un nœud sur le canevas pour le configurer, ou glissez-en un nouveau depuis la palette.</p>
    </div>
  </ng-template>
</div>
