# SonarQube scanner config for the Angular app — run via the sonar-scanner
# CLI (npx sonar-scanner, or the sonarqube-scanner npm package), NOT via a
# Maven plugin, since this is a separate npm-built project from
# ingestion-service. See that project's pom.xml for the backend's
# equivalent Sonar config.
#
# projectKey/projectName are placeholders — replace with whatever key you
# register in your SonarQube instance. sonar.host.url defaults to a local
# SonarQube; override with -Dsonar.host.url=... (or the SONAR_HOST_URL env
# var) if yours runs elsewhere. sonar.token is intentionally NOT set here —
# never commit a token — pass it via -Dsonar.token=... or the SONAR_TOKEN
# env var at scan time instead.
sonar.projectKey=omnichannel-frontend
sonar.projectName=Omnichannel Frontend
sonar.host.url=http://localhost:9000

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/*.spec.ts,**/environments/**,**/*.model.ts
sonar.sourceEncoding=UTF-8

# Must match karma.conf.js's coverageReporter.dir + the lcovonly file name
# exactly, or Sonar silently reports 0% coverage instead of failing loudly.
sonar.javascript.lcov.reportPaths=coverage/omnichannel-frontend/lcov.info
sonar.typescript.lcov.reportPaths=coverage/omnichannel-frontend/lcov.info
