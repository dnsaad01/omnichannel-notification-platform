services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL Database (User Preferences & Client Info)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: notification_postgres
    restart: always
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ---------------------------------------------------------------------------
  # 2. Redis (Rate Limiting & Caching)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: notification_redis
    restart: always
    ports:
      - "6379:6379"

  # ---------------------------------------------------------------------------
  # 3. Mailpit (Development SMTP & Email Inspector)
  # ---------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: notification_mailpit
    restart: always
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP Server

  # ---------------------------------------------------------------------------
  # 4. Apache Kafka & Zookeeper (Event Broker)
  # ---------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: notification_zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: notification_kafka
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # ---------------------------------------------------------------------------
  # 5. Ingestion Service (Spring Boot Application)
  # ---------------------------------------------------------------------------
  ingestion-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notification_ingestion_service
    restart: always
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: adminpassword
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
    depends_on:
      - postgres
      - redis
      - kafka

  # ---------------------------------------------------------------------------
  # 6. Angular Frontend Web Application
  # ---------------------------------------------------------------------------
  angular-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: notification_angular_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - ingestion-service

volumes:
  postgres_data:
