version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL Database (User Preferences & Client Info)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: notification_postgres
    restart: always
    environment:
      POSTGRES_DB: omnichannel_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ---------------------------------------------------------------------------
  # 2. Redis (Rate Limiting & Caching)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: notification_redis
    restart: always
    ports:
      - "6379:6379"

  # ---------------------------------------------------------------------------
  # 3. Mailpit (Development SMTP & Email Inspector)
  # ---------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: notification_mailpit
    restart: always
    ports:
      - "8025:8025" # Web UI (To view captured emails: http://localhost:8025)
      - "1025:1025" # SMTP Server

  # ---------------------------------------------------------------------------
  # 4. Apache Kafka & Zookeeper (Event Broker)
  # ---------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: notification_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: notification_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # ---------------------------------------------------------------------------
  # 5. Kafka UI (Web Dashboard: http://localhost:8085)
  # ---------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: notification_kafka_ui
    depends_on:
      - kafka
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # ---------------------------------------------------------------------------
  # 6. Keycloak IAM (OAuth2 / OIDC: http://localhost:8081)
  # ---------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.2
    container_name: notification_keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - ./ingestion-service/src/main/resources/realm-export.json:/opt/keycloak/data/import/realm.json:ro

  # ---------------------------------------------------------------------------
  # 7. Prometheus (Metrics Monitoring: http://localhost:9090)
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: notification_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./ingestion-service/src/main/resources/prometheus.yml:/etc/prometheus/prometheus.yml

volumes:
  postgres_data:
