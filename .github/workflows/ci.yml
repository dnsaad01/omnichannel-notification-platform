name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Unit Tests (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Ingestion Service Tests
        working-directory: ./ingestion-service
        run: mvn clean test

  frontend-tests:
    name: Frontend Unit Tests (Angular)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: omnichannel-frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./omnichannel-frontend
        run: npm ci

      - name: Run Angular Unit Tests
        working-directory: ./omnichannel-frontend
        run: npm test -- --watch=false --browsers=ChromeHeadless
