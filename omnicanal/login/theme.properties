parent=keycloak
import=common/keycloak

# Custom stylesheet for the OutilPro.ma login theme (Bleu Navy / Orange Sécurité).
# It loads on top of the base Keycloak theme's own CSS, so anything this
# theme doesn't explicitly override (OTP, WebAuthn, IdP review screens, etc.)
# still falls back to Keycloak's default styling instead of breaking.
styles=css/styles.css
