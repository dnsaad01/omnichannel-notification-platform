spring.application.name=ingestion-service
server.port=8082

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5433/omnichannel_db
spring.datasource.username=postgres
spring.datasource.password=postgrespassword
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Configuration
spring.jpa.database=postgresql
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Kafka Broker Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-ingestion-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Real Gmail SMTP Configuration
# Credentials are pulled from the environment (same ${VAR:default} pattern
# already used below for Keycloak) rather than hardcoded, so a real Gmail
# app password never lives in git history. Export MAIL_USERNAME/
# MAIL_PASSWORD locally before running — e.g.
#   export MAIL_USERNAME=dinarisaad06@gmail.com
#   export MAIL_PASSWORD="xxxx xxxx xxxx xxxx"
# (an app password, not the account password — generate one at
# https://myaccount.google.com/apppasswords). With no env var set,
# spring.mail.password defaults to empty and SMTP auth will fail loudly
# rather than silently using a committed secret.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.username=${MAIL_USERNAME:dinarisaad06@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.starttls.enable=true
# Added alongside the NotificationNodeHandler synchronous-EMAIL-dispatch fix
# (Phase 4 bugfix): the workflow engine now blocks on this SMTP call on its
# own processing thread, so an unreachable/hung host must fail fast (5s)
# rather than stall execution advancement indefinitely.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


# Keycloak IAM Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/omnichannel-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/realms/omnichannel-realm/protocol/openid-connect/certs

# Observability & Prometheus Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=ingestion-service

# Workflow Engine — email-open tracking pixel (Phase 4). Must match the
# host/port a real recipient's mail client can actually reach; localhost is
# fine for local dev/demo purposes only.
app.tracking.base-url=http://localhost:8082

